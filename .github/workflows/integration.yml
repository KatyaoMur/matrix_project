name: Integration CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Python modules
        run: python -m compileall -q src

      - name: Check code style
        run: python -m flake8 src tests

      - name: Test integration and check coverage
        run: python -m pytest -v --cov=src --cov-report=term-missing --cov-fail-under=90
